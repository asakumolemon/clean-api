{{template "head" .}}
<div class="layout">
  {{template "sidebar" .}}
  <main class="main">
    <h1>用户管理</h1>
    {{template "flash" .}}

    <article>
      <details open>
        <summary role="button" class="secondary outline">新建用户</summary>
        <form method="post" action="/admin/users" class="form-grid">
          <label>用户名
            <input type="text" name="username" required>
          </label>
          <label>初始密码
            <input type="password" name="password" required>
          </label>
          <label>角色
            <select name="role">
              <option value="user">user（仅 API 使用）</option>
              <option value="admin">admin（可管理本页面）</option>
            </select>
          </label>
          <div style="align-self:end">
            <button type="submit">创建</button>
          </div>
        </form>
      </details>
    </article>

    <table>
      <thead>
        <tr><th>ID</th><th>用户名</th><th>角色</th><th>令牌数</th><th>创建时间</th><th>操作</th></tr>
      </thead>
      <tbody>
        {{range .Users}}
        <tr>
          <td>{{.ID}}</td>
          <td>{{.Username}}</td>
          <td>
            <form method="post" action="/admin/users/{{.ID}}/role" style="display:inline">
              <select name="role" onchange="this.form.submit()">
                <option value="user" {{if eq .Role "user"}}selected{{end}}>user</option>
                <option value="admin" {{if eq .Role "admin"}}selected{{end}}>admin</option>
              </select>
            </form>
          </td>
          <td>{{.TokenCount}}</td>
          <td>{{.CreatedAt.Format "2006-01-02"}}</td>
          <td>
            <form method="post" action="/admin/users/{{.ID}}/password" style="display:inline">
              <input type="password" name="password" placeholder="新密码" required style="width:8rem">
              <button type="submit" class="outline">重置密码</button>
            </form>
            <form method="post" action="/admin/users/{{.ID}}/delete" style="display:inline"
                  onsubmit="return confirm('确认删除用户 {{.Username}}？其全部令牌将一并删除。')">
              <button type="submit" class="secondary outline">删除</button>
            </form>
          </td>
        </tr>
        {{else}}
        <tr><td colspan="6">暂无用户</td></tr>
        {{end}}
      </tbody>
    </table>
  </main>
</div>
</body>
</html>

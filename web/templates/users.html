{{template "head" .}}
<div class="flex min-h-screen">
  {{template "sidebar" .}}
  <main class="flex-1 p-8">
    <h1 class="mb-6 text-2xl font-bold text-slate-900">用户管理</h1>
    {{template "flash" .}}

    <div class="mb-6 max-w-2xl rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <details open>
        <summary
          class="mb-4 inline-block cursor-pointer list-none rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 [&::-webkit-details-marker]:hidden">新建用户</summary>
        <form method="post" action="/admin/users" class="grid grid-cols-1 gap-4 items-end md:grid-cols-3">
          <div>
            <label for="username" class="mb-1 block text-sm font-medium text-slate-700">用户名</label>
            <input id="username" type="text" name="username" required
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
          </div>
          <div>
            <label for="password" class="mb-1 block text-sm font-medium text-slate-700">初始密码</label>
            <input id="password" type="password" name="password" required
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
          </div>
          <div>
            <label for="role" class="mb-1 block text-sm font-medium text-slate-700">角色</label>
            <select id="role" name="role"
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
              <option value="user">user（仅 API 使用）</option>
              <option value="admin">admin（可管理本页面）</option>
            </select>
          </div>
          <div class="md:col-span-3">
            <button type="submit"
              class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">创建</button>
          </div>
        </form>
      </details>
    </div>

    <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white shadow-sm">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-200 text-left text-xs uppercase text-slate-500">
            <th class="px-4 py-3 font-medium">ID</th>
            <th class="px-4 py-3 font-medium">用户名</th>
            <th class="px-4 py-3 font-medium">角色</th>
            <th class="px-4 py-3 font-medium">令牌数</th>
            <th class="px-4 py-3 font-medium">创建时间</th>
            <th class="px-4 py-3 font-medium">操作</th>
          </tr>
        </thead>
        <tbody>
          {{range .Users}}
          <tr class="border-b border-slate-100">
            <td class="px-4 py-3">{{.ID}}</td>
            <td class="px-4 py-3">{{.Username}}</td>
            <td class="px-4 py-3">
              <form method="post" action="/admin/users/{{.ID}}/role" class="inline">
                <select name="role" onchange="this.form.submit()"
                  class="rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:border-blue-500 focus:outline-none">
                  <option value="user" {{if eq .Role "user"}}selected{{end}}>user</option>
                  <option value="admin" {{if eq .Role "admin"}}selected{{end}}>admin</option>
                </select>
              </form>
            </td>
            <td class="px-4 py-3">{{.TokenCount}}</td>
            <td class="px-4 py-3">{{.CreatedAt.Format "2006-01-02"}}</td>
            <td class="px-4 py-3 whitespace-nowrap">
              <form method="post" action="/admin/users/{{.ID}}/password" class="mr-1 inline">
                <input type="password" name="password" placeholder="新密码" required
                  class="w-28 rounded-md border border-slate-300 px-2 py-1.5 text-sm focus:border-blue-500 focus:outline-none">
                <button type="submit"
                  class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100">重置密码</button>
              </form>
              <form method="post" action="/admin/users/{{.ID}}/delete" class="inline"
                onsubmit="return confirm('确认删除用户 {{.Username}}？其全部令牌将一并删除。')">
                <button type="submit"
                  class="rounded-md border border-red-200 bg-white px-3 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50">删除</button>
              </form>
            </td>
          </tr>
          {{else}}
          <tr><td colspan="6" class="px-4 py-8 text-center text-slate-500">暂无用户</td></tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>

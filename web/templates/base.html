{{define "head"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
  .flash { @apply mb-4 rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800; }
</style>
{{block "extra_head" .}}{{end}}
</head>
<body class="min-h-screen bg-slate-100">
{{end}}

{{define "sidebar"}}
<aside class="sticky top-0 flex h-dvh w-56 shrink-0 flex-col border-r border-slate-200 bg-slate-900 text-slate-200">
  <h1 class="px-4 py-5 text-base font-bold text-white">智能 API 网关</h1>
  <nav class="flex-1 space-y-0.5 overflow-y-auto px-3">
    <a href="/admin/" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "dashboard"}}bg-blue-600 text-white{{end}}">仪表盘</a>
    <a href="/admin/channels" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "channels"}}bg-blue-600 text-white{{end}}">渠道管理</a>
    <a href="/admin/models" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "models"}}bg-blue-600 text-white{{end}}">模型管理</a>
    <a href="/admin/tokens" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "tokens"}}bg-blue-600 text-white{{end}}">令牌管理</a>
    <a href="/admin/logs" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "logs"}}bg-blue-600 text-white{{end}}">请求日志</a>
    <a href="/admin/playground" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "playground"}}bg-blue-600 text-white{{end}}">测试台</a>
    <a href="/admin/users" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "users"}}bg-blue-600 text-white{{end}}">用户管理</a>
    <a href="/admin/export" class="block rounded-md px-3 py-2 text-sm hover:bg-slate-800 {{if eq .Active "export"}}bg-blue-600 text-white{{end}}">导入导出</a>
  </nav>
  <div class="px-4 py-4">
    <form method="post" action="/admin/logout">
      <button type="submit" class="block w-full rounded-md px-3 py-2 text-left text-sm text-slate-400 hover:bg-slate-800 hover:text-white">退出</button>
    </form>
    <p class="mt-3 text-xs text-slate-500">v{{.Version}}</p>
  </div>
</aside>
{{end}}

{{define "flash"}}
{{if .Flash}}<div class="flash" role="alert">{{.Flash}}</div>{{end}}
{{end}}
